  entries:
  - version: 4.4.1
    date: '2026-07-21'
    breaking: false
    highlights:
    - Security fix - background callbacks trusted client-supplied job/cacheKey query parameters,
      allowing an unauthenticated client to terminate an arbitrary process or read and delete
      result-cache entries. Handles are now HMAC-signed and bound to a per-page-load token (#3902).
    - Fixed callbacks registering twice under uvicorn import-string reload (#3883).
    - Restored Flask-WTF CSRFProtect exemption via the dash.dash.dispatch view name (#3885).
  - version: 4.4.0
    date: '2026-07-03'
    breaking: true
    breaking_note: Dropped support for Python 3.8 (EOL October 2024); minimum is now Python 3.9.
    highlights:
    - WebSocket callback dispatch no longer limits concurrent users; new websocket_max_workers
      argument to Dash (#3826).
    - Added Plotly hoveranywhere/clickanywhere event support in dcc.Graph via xvals/yvals (#3852).
  - version: 4.3.0
    date: '2026-06-19'
    breaking: false
  - version: 4.2.0
    date: '2026-06-01'
    breaking: false
  - version: unreleased
    date: null
    breaking: true
    breaking_note: React 16 support removed - 16.14.0 is no longer an accepted REACT_VERSION.
    highlights:
    - Opt-in partial pattern matching for callback dependencies via partial_pattern=True (#3765).
    - Experimental React 19 support behind REACT_VERSION=19.2.4; default remains React 18.3.1 (#3646).
    - Optional gzip compression of server-side callback request payloads via compress_payload /
      compress_threshold (#3925).
