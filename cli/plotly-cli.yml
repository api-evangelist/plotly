- name: plotly
  product: Plotly Cloud
  docs: https://dash.plotly.com/plotly-cloud/cli
  install:
  - method: pip
    command: pip install "dash[cloud]"
  verify: plotly --help
  authentication:
    interactive: plotly user login
    non_interactive:
    - flag: --api-key "<key>"
    - env: PLOTLY_API_KEY
  config_file: plotly-cloud.toml
  commands:
  - group: user
    commands:
    - name: plotly user login
      summary: Browser-based sign-in that stores credentials locally.
    - name: plotly user whoami
      summary: Show the signed-in account.
    - name: plotly user logout
      summary: Clear stored credentials.
    - name: plotly user teams
      summary: List the teams the account belongs to.
  - group: app
    commands:
    - name: plotly app publish
      summary: Publish a Dash or Plotly Studio app to Plotly Cloud.
      flags:
      - --name
      - --config
      - --team
    - name: plotly app status
      summary: Report the status of a published app.
- name: dds-client
  product: Dash Enterprise
  docs: https://github.com/plotly/dds-client
