  language: go
  install:
  - method: build-from-source
    command: go build -o dds-client
  authentication:
    env:
    - DASH_ENTERPRISE_URL
    - DASH_ENTERPRISE_USERNAME
    - DASH_ENTERPRISE_API_KEY
  backing_api: https://{dash-enterprise-host}/Manager/graphql
  commands:
