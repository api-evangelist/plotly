  - name: apps:create
    summary: Create an app.
    flags: [--name]
  - name: apps:delete
    summary: Delete an app.
    flags: [--name]
  - name: postgres:list
    summary: List all Postgres services.
  - name: postgres:exists
    summary: Check whether a Postgres service exists.
- name: Dash Enterprise CLI
  product: Dash Enterprise
  docs: https://dash.plotly.com/dash-enterprise/cli
  summary: >-
    Command line interface for Dash Enterprise app management - deploy, list, initialize and
    update apps.
  authentication:
    protocol: OAuth 2.0 / OpenID Connect
    authorization_server: Keycloak
    tokens: >-
      The CLI requests access and offline tokens from Keycloak. Access tokens are valid for 24
      hours by default and refreshed for 30 days.
    login_methods:
    - browser-based flow
    - username and password (recommended for CI/CD)
