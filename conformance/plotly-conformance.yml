domain_standard_conformance:
  applicable: false
  reason: >-
    Plotly is horizontal data-visualization tooling. Its verticals (finance, healthcare, energy,
    retail) are the verticals of its CUSTOMERS' data, not of its API contract, and no vertical
    message format, identifier scheme or schema URN appears anywhere in its published surface.
    Reward-only check - recorded as not applicable rather than false.
  probed_for:
  - FHIR resource shapes
  - SCIM schema URNs
  - OData $metadata
  - HL7v2 / X12 / ISO 20022 message types
  - OAI-PMH / DataCite / ORCID identifier schemes
