apis:
- name: Dash Docs MCP Server
  description: >-
    A remote Model Context Protocol server published by Plotly that lets AI agents search and
    read the Dash documentation directly. Exposes list_pages, search_pages and
    get_page_as_markdown. Authenticated with a Plotly Cloud account over OAuth 2.1
    (RFC 9728 protected-resource metadata is served alongside it).
  humanURL: https://dash.plotly.com/mcp
  baseURL: https://dash.plotly.com/_mcp
  tags:
  - MCP
  - Documentation
  - Agents
  properties:
  - type: MCPServer
    url: mcp/plotly-mcp.yml
  - type: Documentation
    url: https://dash.plotly.com/mcp
- name: Dash Enterprise GraphQL API
  description: >-
    The first-party GraphQL management API for Dash Enterprise, served from each customer's own
    Dash Enterprise host at /Manager/graphql. Covers app lifecycle, collaborators, environment
    variables, linked services (Postgres/Redis), workspaces, process scaling, resource requests,
    mounted directories, portals and SSH keys. Plotly publishes the reference and runnable
    examples in the plotly/dds-api-docs repository and ships a Go client (plotly/dds-client).
  humanURL: https://github.com/plotly/dds-api-docs
  baseURL: https://{dash-enterprise-host}/Manager/graphql
  tags:
  - GraphQL
  - Deployment
  - Platform Management
  properties:
  - type: GraphQL
    url: graphql/plotly-dash-enterprise-graphql.yml
  - type: Documentation
    url: https://github.com/plotly/dds-api-docs
  - type: SourceCode
    url: https://github.com/plotly/dds-client
