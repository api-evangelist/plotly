aid: plotly
name: Plotly
description: >-
  Plotly is a Montreal-based data visualization and analytics company behind the open-source
  Plotly graphing libraries (plotly.js, plotly.py, Plotly.R, Plotly.NET, plotly.rs, Dash.jl)
  and the Dash framework for building interactive analytical web applications in Python.
  Its commercial products are Plotly Studio, an AI-native desktop application that generates
  Dash data apps from a dataset; Plotly Cloud, the hosted publishing and sharing platform for
  Dash and Studio apps; and Dash Enterprise, the self-hosted data app platform used by
  financial services, healthcare and life sciences, energy, and retail organizations. Plotly's
  machine-readable surfaces are a remote Dash Docs MCP server, an OAuth 2.1/OIDC authorization
  server for Plotly Cloud, and a first-party GraphQL management API for Dash Enterprise. The
  legacy Chart Studio Cloud REST API was retired on 2025-10-31.
