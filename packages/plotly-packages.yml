note: >-
  Plotly's distribution model is unusual for this catalog: the packages ARE the product. The
  graphing libraries and the Dash framework are the primary surface, not client SDKs wrapping a
  remote API. Two of the entries below are explicitly decayed and recorded as such: chart-studio
  (last release 2020-04-01) wraps the Chart Studio Cloud REST API that Plotly retired on
  2025-10-31, and the npm `plotly` package (last release 2015-12-30) is a third-party Node.js
  wrapper for that same retired service.
